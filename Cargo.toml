[package]
name = "pptx-render"
version = "0.1.0"
edition = "2024"
description = "Render PPTX slides as images"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = "0.25"
quick-xml = { version = "0.36", features = ["serialize"] }
tiny-skia = "0.11"
fontdb = "0.22"
ttf-parser = "0.24"
zip = "2"

[dev-dependencies]
tempfile = "3"
